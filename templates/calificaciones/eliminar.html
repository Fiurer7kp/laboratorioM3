{% extends 'base.html' %}
{% block content %}
<div class="alert alert-danger">
    <h3>¿Eliminar calificación de {{ calificacion.nombre_estudiante }}?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'listar' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
